name: CollabYouth CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # Opt into Node.js 24 ahead of June 2nd deadline

jobs:

  # ─────────────────────────────────────────────────────────────────
  # JOB 1 : Build & Test Backend (Spring Boot)
  # ─────────────────────────────────────────────────────────────────
  build-and-test-backend:
    name: Build & Test Backend
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download the code from GitHub
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      # Step 2: Install Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4.7.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Step 3: Build the project and run all JUnit tests except the Spring context test
      # CollabyouthApplicationTests is excluded because it requires a live DB connection
      - name: Build with Maven and run tests
        run: mvn clean package -Dtest="!CollabyouthApplicationTests" -Dsurefire.failIfNoSpecifiedTests=false
        working-directory: collabyouth_backend

      # Step 4: Publish JUnit test results inline on PRs
      - name: Publish test results
        uses: dorny/test-reporter@v1.9.1
        if: always()
        with:
          name: JUnit Tests
          path: collabyouth_backend/target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false

      # Step 5: Upload the JAR as an artifact only if tests passed
      - name: Upload JAR artifact
        if: success()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: collabyouth-jar
          path: collabyouth_backend/target/*.jar

  # ─────────────────────────────────────────────────────────────────
  # JOB 2 : Build & Test Frontend (Next.js + Jest)
  # ─────────────────────────────────────────────────────────────────
  build-and-test-frontend:
    name: Build & Test Frontend
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download the code from GitHub
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      # Step 2: Install Node.js 20 (matches the version in the frontend Dockerfile)
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: collabyouth_frontend/package-lock.json

      # Step 3: Install dependencies using ci for a clean, reproducible install
      - name: Install dependencies
        run: npm ci
        working-directory: collabyouth_frontend

      # Step 4: Run Jest tests with coverage
      # NEXT_PUBLIC_API_URL points to localhost in CI (no real backend running)
      - name: Run frontend tests
        run: npm run test:ci
        working-directory: collabyouth_frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8081

      # Step 5: Build the Next.js app to catch any build-time errors
      # NEXT_PUBLIC_API_URL is injected at build time — required by Next.js
      - name: Build Next.js app
        run: npm run build
        working-directory: collabyouth_frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8081

  # ─────────────────────────────────────────────────────────────────
  # JOB 3 : Docker — Build & Push Backend Image
  # Runs only on main, after backend tests pass
  # ─────────────────────────────────────────────────────────────────
  docker-backend:
    name: Build and Push Backend Image
    runs-on: ubuntu-latest
    needs: build-and-test-backend
    if: github.ref == 'refs/heads/main'

    steps:
      # Step 1: Download the code
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      # Step 2: Download the tested JAR instead of rebuilding from scratch
      - name: Download JAR artifact
        uses: actions/download-artifact@v4.3.0
        with:
          name: collabyouth-jar
          path: collabyouth_backend/target/

      # Step 3: Log in to Docker Hub using an access token (not your password)
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME_WAFAE }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN_WAFAE }}

      # Step 4: Set up Docker Buildx for layer caching support
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 5: Build and push with caching — no Maven re-run
      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: collabyouth_backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME_WAFAE }}/collabyouth-backend:latest
            ${{ secrets.DOCKER_USERNAME_WAFAE }}/collabyouth-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────
  # JOB 4 : Docker — Build & Push Frontend Image
  # Runs only on main, after frontend tests pass
  # NEXT_PUBLIC_API_URL est injecté au moment du build Docker
  # En production, il pointe vers le vrai backend via docker-compose
  # ─────────────────────────────────────────────────────────────────
  docker-frontend:
    name: Build and Push Frontend Image
    runs-on: ubuntu-latest
    needs: build-and-test-frontend
    if: github.ref == 'refs/heads/main'

    steps:
      # Step 1: Download the code
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      # Step 2: Log in to Docker Hub using an access token (not your password)
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME_WAFAE }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN_WAFAE }}

      # Step 3: Set up Docker Buildx for layer caching support
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 4: Build and push the Next.js image
      # NEXT_PUBLIC_API_URL is passed as build-arg so Next.js embeds it at build time
      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: collabyouth_frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME_WAFAE }}/collabyouth-frontend:latest
            ${{ secrets.DOCKER_USERNAME_WAFAE }}/collabyouth-frontend:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  # ─────────────────────────────────────────────────────────────────
  # JOB 5 : Deploy to Minikube (self-hosted runner sur ton PC)
  # Tourne sur TON PC via l'agent GitHub Actions
  # ─────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Minikube
    runs-on: [self-hosted, wafae-pc]
    needs: [docker-backend, docker-frontend]
    if: github.ref == 'refs/heads/main'

    steps:
      # Step 1: Télécharger le code pour avoir les fichiers Kubernetes/
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      # Step 2: Appliquer les fichiers Kubernetes
      # kubectl apply met à jour les deployments existants ou les crée
      - name: Deploy to Minikube
        run: kubectl apply -f Kubernetes/

      # Step 3: Forcer le redémarrage pour récupérer la nouvelle image :latest
      - name: Restart deployments to pull latest images
        run: |
          kubectl rollout restart deployment/backend-deployment
          kubectl rollout restart deployment/frontend-deployment

      # Step 4: Attendre que les pods soient prêts
      - name: Wait for deployments to be ready
        run: |
          kubectl rollout status deployment/backend-deployment --timeout=120s
          kubectl rollout status deployment/frontend-deployment --timeout=120s

      # Step 5: Afficher l'URL d'accès
      - name: Show app URL
        run: minikube service frontend-service --url