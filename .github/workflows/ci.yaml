name: CollabYouth CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # Opt into Node.js 24 ahead of June 2nd deadline

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download the code from GitHub
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      # Step 2: Install Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4.7.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Step 3: Build the project and run all JUnit tests except the Spring context test
      # CollabyouthApplicationTests is excluded because it requires a live DB connection
      - name: Build with Maven and run tests
        run: mvn clean package -Dtest="!CollabyouthApplicationTests" -DfailIfNoTests=false
        working-directory: collabyouth_backend

      # Step 4: Publish JUnit test results inline on PRs
      - name: Publish test results
        uses: dorny/test-reporter@v1.9.1
        if: always()
        with:
          name: JUnit Tests
          path: collabyouth_backend/target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false

      # Step 5: Upload the JAR as an artifact only if tests passed
      - name: Upload JAR artifact
        if: success()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: collabyouth-jar
          path: collabyouth_backend/target/*.jar

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      # Step 1: Download the code
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      # Step 2: Download the tested JAR instead of rebuilding from scratch
      - name: Download JAR artifact
        uses: actions/download-artifact@v4.3.0
        with:
          name: collabyouth-jar
          path: collabyouth_backend/target/

      # Step 3: Log in to Docker Hub using an access token (not your password)
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      # Step 4: Set up Docker Buildx for layer caching support
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 5: Build and push with caching — no Maven re-run
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: collabyouth_backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/collabyouth:latest
            ${{ secrets.DOCKER_USERNAME }}/collabyouth:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
