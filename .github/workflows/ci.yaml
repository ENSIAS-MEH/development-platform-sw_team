name: CollabYouth CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download the code from GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Step 3: Build the project and run all JUnit tests
      - name: Build with Maven and run tests
        run: mvn clean package -DskipTests=false

      # Step 4: Publish JUnit test results inline on PRs
      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: JUnit Tests
          path: target/surefire-reports/*.xml
          reporter: java-junit

      # Step 5: If tests passed, upload the JAR as an artifact
      - name: Upload JAR artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: collabyouth-jar
          path: target/*.jar

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      # Step 1: Download the code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Download the tested JAR instead of rebuilding from scratch
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: collabyouth-jar
          path: target/

      # Step 3: Log in to Docker Hub using an access token (not your password)
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      # Step 4: Set up Docker Buildx for layer caching support
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 5: Build and push with caching — no Maven re-run
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/collabyouth:latest
            ${{ secrets.DOCKER_USERNAME }}/collabyouth:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
